<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="Three regimes of a serving engine: cold, warm and under load.">

<style>
  svg { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .lbl  { font-size: 8.5px; letter-spacing: 1.4px; fill: #0F0E0A; }
  .tiny { font-size: 8px;   letter-spacing: 1.2px; fill: #6B645A; }
  .tree { font-size: 10.5px; fill: #0F0E0A; }
  .treeK{ font-size: 10.5px; fill: #0F0E0A; font-weight: 700; }
  .val  { font-size: 13px;  fill: #0F0E0A; }
  .mut  { font-size: 9.5px; fill: #6B645A; }
  .foot { font-size: 8.5px; letter-spacing: 1.6px; fill: #6B645A; }
  .log  { font-size: 9.5px; fill: #9A9388; }
  .logT { fill: #6B645A; }
  .hi, .hi2, .hi3 { mix-blend-mode: multiply; }

  /* 27s loop — three regimes: cold 0-33%, warm 33-66%, burst 66-100% */
  @keyframes reg1 { 0%,30%{opacity:1} 33%,97%{opacity:0} 100%{opacity:1} }
  @keyframes reg2 { 0%,30%{opacity:0} 33%,63%{opacity:1} 66%,100%{opacity:0} }
  @keyframes reg3 { 0%,63%{opacity:0} 66%,97%{opacity:1} 100%{opacity:0} }
  .r1 { animation: reg1 27s linear infinite; }
  .r2 { animation: reg2 27s linear infinite; }
  .r3 { animation: reg3 27s linear infinite; }

  /* radix walk — root, then sys+tools, then node B */
  @keyframes hiA { 0%,35%{opacity:0} 38%,62%{opacity:.4} 66%,100%{opacity:0} }
  @keyframes hiB { 0%,39%{opacity:0} 42%,62%{opacity:.4} 66%,100%{opacity:0} }
  @keyframes hiC { 0%,44%{opacity:0} 47%,96%{opacity:.45} 100%{opacity:0} }
  .hi  { animation: hiA 27s linear infinite; }
  .hi2 { animation: hiB 27s linear infinite; }
  .hi3 { animation: hiC 27s linear infinite; }

  @keyframes newTag  { 0%,13%{opacity:0} 17%,30%{opacity:1} 33%,100%{opacity:0} }
  @keyframes evictLbl{ 0%,85%{opacity:0} 88%,96%{opacity:1} 100%{opacity:0} }
  .nt { animation: newTag 27s linear infinite; }
  .et { animation: evictLbl 27s linear infinite; }

  /* in-flight batch — no drain between requests */
  @keyframes seqRunA { 0%,18%{width:0px} 54%,92%{width:490px} 97%,100%{width:0px} }
  @keyframes seqRunB { 0%,26%{width:0px} 62%,92%{width:450px} 97%,100%{width:0px} }
  @keyframes slotFinish { 0%,55%{opacity:1} 60%,93%{opacity:.15} 97%,100%{opacity:1} }
  @keyframes slotAdmit  { 0%,60%{opacity:0} 65%,93%{opacity:1} 97%,100%{opacity:0} }
  .rb  { animation: seqRunA 9s linear infinite; }
  .rb2 { animation: seqRunB 9s linear infinite; }
  .fin { animation: slotFinish 9s linear infinite; }
  .adm { animation: slotAdmit 9s linear infinite; }

  /* the gpu — compute pinned cold, bandwidth pinned warm, both under load */
  @keyframes gpuC { 0%,28%{y:150px;height:50px} 35%,61%{y:189px;height:11px} 69%,96%{y:158px;height:42px} 100%{y:150px;height:50px} }
  @keyframes gpuB { 0%,28%{y:187px;height:13px} 35%,61%{y:154px;height:46px} 69%,96%{y:151px;height:49px} 100%{y:187px;height:13px} }
  .gc { animation: gpuC 27s linear infinite; }
  .gb { animation: gpuB 27s linear infinite; }

  /* kv cache — black overlay is the freshly prefilled tail, purple beneath is reuse */
  @keyframes kvFresh { 0%,28%{width:664px} 35%,61%{width:48px} 69%,96%{width:173px} 100%{width:664px} }
  .kw { animation: kvFresh 27s linear infinite; }

  /* the fleet — scales on queue */
  @keyframes queue { 0%,28%{width:64px} 35%,61%{width:132px} 72%,88%{width:466px} 96%,100%{width:64px} }
  @keyframes rep   { 0%,66%{opacity:0} 70%,90%{opacity:1} 95%,100%{opacity:0} }
  @keyframes soLbl { 0%,66%{opacity:0} 70%,86%{opacity:1} 89%,100%{opacity:0} }
  @keyframes siLbl { 0%,89%{opacity:0} 92%,97%{opacity:1} 100%{opacity:0} }
  .qq { animation: queue 27s linear infinite; }
  .p2 { animation: rep 27s linear infinite; }
  .p3 { animation: rep 27s linear infinite; animation-delay: .4s; }
  .so { animation: soLbl 27s linear infinite; }
  .si { animation: siLbl 27s linear infinite; }

  /* scheduler log — per-line animation-delay phase-shifts each line inside the same 27s period */
  @keyframes logIn { 0%{opacity:0} 2%{opacity:1} 90%{opacity:1} 97%,100%{opacity:0} }
  .L { opacity: 0; animation: logIn 27s linear infinite; }
</style>

<rect x="0" y="0" width="1000" height="490" fill="#FAF6EC"></rect>
<rect x="0.5" y="0.5" width="999" height="429" fill="none" stroke="#0F0E0A"></rect>

<line x1="0" y1="34" x2="1000" y2="34" stroke="#DDD6C8"></line>
<text class="m lbl" x="18" y="22" fill="#0F0E0A">THE PIPELINE</text>
<g class="m" font-size="10" letter-spacing="1.2" fill="#0F0E0A" text-anchor="end">
  <text class="r1" x="982" y="22">REGIME 1 · COLD · NOTHING TO REUSE · COMPUTE PINNED</text>
  <text class="r2" opacity="0" x="982" y="22">REGIME 2 · WARM · DEEP PREFIX HIT · BANDWIDTH PINNED</text>
  <text class="r3" opacity="0" x="982" y="22">REGIME 3 · BURST · QUEUE CLIMBS · REPLICAS SCALE OUT</text>
</g>

<line x1="300" y1="34" x2="300" y2="296" stroke="#DDD6C8"></line>

<text class="m lbl" x="18" y="56">RADIX PREFIX TREE</text>
<text class="m tiny" x="18" y="68">LIVE · GROWS · EVICTS</text>
<g class="m">
  <text class="treeK" x="18" y="90">root</text>
  <text class="tree" x="282" y="90" text-anchor="end" fill="#C8C0B0">2,048 tok</text>
  <rect class="hi" opacity="0" x="35" y="79" width="97" height="15" fill="#B9A0FF"></rect>
  <text class="tree" x="18" y="106"><tspan fill="#C8C0B0">├─ </tspan>sys+tools · 512</text>
  <rect class="hi2" opacity="0" x="56" y="95" width="118" height="15" fill="#B9A0FF"></rect>
  <text class="tree" x="18" y="122"><tspan fill="#C8C0B0">│  ├─ </tspan>doc corpus · 1,392</text>
  <g class="ec">
    <text class="tree" x="18" y="138"><tspan fill="#C8C0B0">│  │  ├─ </tspan>node C · 640</text>
    <text class="et" opacity="0" x="200" y="138" font-size="10.5" fill="#FF6B4A">lru evict</text>
  </g>
  <g class="nb">
    <rect class="hi3" opacity="0" x="77" y="127" width="90" height="15" fill="#B9A0FF"></rect>
    <text class="tree" x="18" y="154"><tspan fill="#C8C0B0">│  │  └─ </tspan>node B · 1,904</text>
    <text class="tree" x="188" y="154" fill="#0F0E0A"><tspan class="nt" opacity="0">new</tspan></text>
  </g>
  <text class="tree" x="18" y="170" fill="#C8C0B0">└─ scratch · 0</text>
</g>

<g class="m">
  <g class="r1">
    <text class="tiny" x="18" y="196">REQ 8390 · NO MATCH</text>
    <text class="val" x="18" y="211">0 / 2,048 reused · 0 %</text>
    <text class="mut" x="18" y="225">whole prompt prefilled, node B created</text>
  </g>
  <g class="r2" opacity="0">
    <text class="tiny" x="18" y="196">REQ 8412 → NODE B</text>
    <text class="val" x="18" y="211">1,904 / 2,048 reused · 93 %</text>
    <text class="mut" x="18" y="225">only 144 tok left to prefill</text>
  </g>
  <g class="r3" opacity="0">
    <text class="tiny" x="18" y="196">61 REQ / S · ALL ON NODE B</text>
    <text class="val" x="18" y="211">reuse 74 % · queue 88 %</text>
    <text class="mut" x="18" y="225" fill="#FF6B4A">hot node capped, spill to cpu tier</text>
  </g>
</g>

<line x1="18" y1="240" x2="282" y2="240" stroke="#DDD6C8"></line>
<g class="m">
  <text class="lbl" x="18" y="256">ROUTER POLICY</text>
  <text class="mut" x="18" y="270"><tspan fill="#9A9388">cap</tspan>    35 % of arrivals per node</text>
  <text class="mut" x="18" y="282"><tspan fill="#9A9388">spill</tspan>  gpu → cpu tier, prefix kept</text>
</g>

<g class="m">
  <text class="lbl" x="318" y="56">IN-FLIGHT BATCH · 8 SLOTS</text>
  <text class="lbl" x="870" y="56" text-anchor="end">NO DRAIN BETWEEN REQUESTS</text>
</g>
<g class="m" font-size="8.5" fill="#9A9388" text-anchor="end">
  <text x="372" y="73">seq 8391</text><text x="372" y="85">seq 8399</text><text x="372" y="97">seq 8413</text>
  <text x="372" y="109">seq 8402</text><text x="372" y="121">seq 8412</text>
</g>
<g>
  <rect x="380" y="66" width="490" height="8" fill="#EFE8D8"></rect><rect x="380" y="66" width="490" height="8" fill="#0F0E0A"></rect>
  <rect x="380" y="78" width="490" height="8" fill="#EFE8D8"></rect><rect class="fin" x="380" y="78" width="216" height="8" fill="#0F0E0A"></rect>
  <rect x="380" y="90" width="490" height="8" fill="#EFE8D8"></rect><rect class="adm" opacity="0" x="596" y="90" width="147" height="8" fill="#B9A0FF" stroke="#0F0E0A"></rect>
  <rect x="380" y="102" width="490" height="8" fill="#EFE8D8"></rect><rect class="rb" x="380" y="102" width="490" height="8" fill="#0F0E0A"></rect>
  <rect x="380" y="114" width="490" height="8" fill="#EFE8D8"></rect><rect class="rb rb2" x="420" y="114" width="450" height="8" fill="#0F0E0A"></rect>
</g>

<text class="m lbl" x="318" y="140">SPECULATIVE DECODE · DRAFT 4, VERIFY ONCE</text>
<g class="m" font-size="9.5" fill="#0F0E0A">
  <g class="r1">
    <text x="318" y="160" font-size="8.5" fill="#9A9388">pass 1</text>
    <rect x="362" y="150" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect><rect x="380" y="150" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect>
    <rect x="398" y="150" width="15" height="13" fill="#FF6B4A" stroke="#9A9388"></rect><rect x="416" y="150" width="15" height="13" fill="#EFE8D8" stroke="#DDD6C8" stroke-dasharray="2 2"></rect>
    <text x="442" y="160">2 / 4</text>
    <text x="318" y="178" font-size="8.5" fill="#9A9388">pass 2</text>
    <rect x="362" y="168" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect><rect x="380" y="168" width="15" height="13" fill="#FF6B4A" stroke="#9A9388"></rect>
    <rect x="398" y="168" width="15" height="13" fill="#EFE8D8" stroke="#DDD6C8" stroke-dasharray="2 2"></rect><rect x="416" y="168" width="15" height="13" fill="#EFE8D8" stroke="#DDD6C8" stroke-dasharray="2 2"></rect>
    <text x="442" y="178">1 / 4</text>
    <text x="318" y="196" font-size="9.5" fill="#6B645A">cold draft model · speculation barely pays here</text>
  </g>
  <g class="r2" opacity="0">
    <text x="318" y="160" font-size="8.5" fill="#9A9388">pass 1</text>
    <rect x="362" y="150" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect><rect x="380" y="150" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect>
    <rect x="398" y="150" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect><rect x="416" y="150" width="15" height="13" fill="#FF6B4A" stroke="#9A9388"></rect>
    <text x="442" y="160">3 / 4</text>
    <text x="318" y="178" font-size="8.5" fill="#9A9388">pass 2</text>
    <rect x="362" y="168" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect><rect x="380" y="168" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect>
    <rect x="398" y="168" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect><rect x="416" y="168" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect>
    <text x="442" y="178">4 / 4 · three tokens free</text>
    <text x="318" y="196" font-size="9.5" fill="#6B645A">templated prompt · the draft guesses almost everything</text>
  </g>
  <g class="r3" opacity="0">
    <text x="318" y="160" font-size="8.5" fill="#9A9388">pass 1</text>
    <rect x="362" y="150" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect><rect x="380" y="150" width="15" height="13" fill="#B9A0FF" stroke="#9A9388"></rect>
    <rect x="398" y="150" width="15" height="13" fill="#FF6B4A" stroke="#9A9388"></rect><rect x="416" y="150" width="15" height="13" fill="#EFE8D8" stroke="#DDD6C8" stroke-dasharray="2 2"></rect>
    <text x="442" y="160">2 / 4</text>
    <text x="318" y="178" font-size="8.5" fill="#9A9388">draft</text>
    <rect x="362" y="168" width="15" height="13" fill="#EFE8D8" stroke="#FF6B4A" stroke-dasharray="2 2"></rect><rect x="380" y="168" width="15" height="13" fill="#EFE8D8" stroke="#FF6B4A" stroke-dasharray="2 2"></rect>
    <rect x="398" y="168" width="15" height="13" fill="#EFE8D8" stroke="#DDD6C8" stroke-dasharray="2 2"></rect><rect x="416" y="168" width="15" height="13" fill="#EFE8D8" stroke="#DDD6C8" stroke-dasharray="2 2"></rect>
    <text x="442" y="178" fill="#FF6B4A">draft 4 → 2</text>
    <text x="318" y="196" font-size="9.5" fill="#6B645A">under load the draft itself competes — so i shorten it</text>
  </g>
</g>

