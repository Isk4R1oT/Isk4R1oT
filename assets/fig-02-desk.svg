<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-label="claude-quant: four acts on one unattended session — three positions, one refusal, one loss.">

<style>
  svg { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .lbl  { font-size: 8.5px; letter-spacing: 1.4px; fill: #6B645A; }
  .tiny { font-size: 8px;   letter-spacing: 1.4px; fill: #6B645A; }
  .code { font-size: 9.5px; fill: #C8C0B0; }
  .sbt  { fill: #F8F5EE; }
  .sb   { fill: none; }
  .foot { font-size: 8.5px; letter-spacing: 1.6px; fill: #6B645A; }

  /* 36s loop — four acts: btc 0-25%, eth 25-50%, sol refusal 50-75%, arb 75-100% */
  @keyframes act1 { 0%,22%{opacity:1} 25%,97%{opacity:0} 100%{opacity:1} }
  @keyframes act2 { 0%,22%{opacity:0} 25%,47%{opacity:1} 50%,100%{opacity:0} }
  @keyframes act3 { 0%,47%{opacity:0} 50%,72%{opacity:1} 75%,100%{opacity:0} }
  @keyframes act4 { 0%,72%{opacity:0} 75%,97%{opacity:1} 100%{opacity:0} }
  .a1 { animation: act1 36s linear infinite; }
  .a2 { animation: act2 36s linear infinite; }
  .a3 { animation: act3 36s linear infinite; }
  .a4 { animation: act4 36s linear infinite; }

  /* position lanes fill as each act opens, and stay closed on the book */
  @keyframes laneA { 0%,4%{width:0px} 16%,97%{width:130px} 100%{width:0px} }
  @keyframes laneB { 0%,29%{width:0px} 41%,97%{width:107px} 100%{width:0px} }
  @keyframes laneD { 0%,79%{width:0px} 89%,97%{width:76px} 100%{width:0px} }
  .l1 { animation: laneA 36s linear infinite; }
  .l2 { animation: laneB 36s linear infinite; }
  .l4 { animation: laneD 36s linear infinite; }

  @keyframes liveA   { 0%,3%{opacity:0}  6%,17%{opacity:1} 21%,100%{opacity:0} }
  @keyframes closedA { 0%,17%{opacity:0} 21%,97%{opacity:1} 100%{opacity:0} }
  @keyframes liveB   { 0%,28%{opacity:0} 31%,42%{opacity:1} 46%,100%{opacity:0} }
  @keyframes closedB { 0%,42%{opacity:0} 46%,97%{opacity:1} 100%{opacity:0} }
  @keyframes liveD   { 0%,78%{opacity:0} 81%,90%{opacity:1} 93%,100%{opacity:0} }
  @keyframes closedD { 0%,90%{opacity:0} 93%,97%{opacity:1} 100%{opacity:0} }
  .v1 { animation: liveA 36s linear infinite; }
  .g1 { animation: closedA 36s linear infinite; }
  .v2 { animation: liveB 36s linear infinite; }
  .g2 { animation: closedB 36s linear infinite; }
  .v4 { animation: liveD 36s linear infinite; }
  .g4 { animation: closedD 36s linear infinite; }

  /* act 3 — the refusal */
  @keyframes refuse { 0%,52%{opacity:0} 56%,72%{opacity:1} 75%,100%{opacity:0} }
  @keyframes stamp  { 0%,58%{opacity:0} 61%,72%{opacity:1} 75%,100%{opacity:0} }
  .rf { animation: refuse 36s linear infinite; }
  .st { animation: stamp 36s linear infinite; }

  /* the ledger accumulates — one DEC per act, including the one that refused */
  @keyframes dec1 { 0%,10%{opacity:0} 14%,97%{opacity:1} 100%{opacity:0} }
  @keyframes dec2 { 0%,35%{opacity:0} 39%,97%{opacity:1} 100%{opacity:0} }
  @keyframes dec3 { 0%,60%{opacity:0} 64%,97%{opacity:1} 100%{opacity:0} }
  @keyframes dec4 { 0%,85%{opacity:0} 89%,97%{opacity:1} 100%{opacity:0} }
  .e1 { animation: dec1 36s linear infinite; }
  .e2 { animation: dec2 36s linear infinite; }
  .e3 { animation: dec3 36s linear infinite; }
  .e4 { animation: dec4 36s linear infinite; }

  /* subagent fan-out — one pass per act */
  @keyframes fan { 0%,2%{opacity:0} 7%,94%{opacity:1} 98%,100%{opacity:0} }
  .ag  { opacity: 0; animation: fan 9s linear infinite; }
  .ag2 { animation-delay: .3s; }
  .ag3 { animation-delay: .6s; }
  .ag4 { animation-delay: .9s; }
  .ag5 { animation-delay: 1.2s; }

  /* the sandbox runs, then the result lands */
  @keyframes sbPulse { 0%,10%{stroke:#2D2A24} 26%,58%{stroke:#B9A0FF} 78%,100%{stroke:#2D2A24} }
  .sb { animation: sbPulse 9s linear infinite; }
  @keyframes resA { 0%,8%{opacity:0}  11%,22%{opacity:1} 25%,100%{opacity:0} }
  @keyframes resB { 0%,33%{opacity:0} 36%,47%{opacity:1} 50%,100%{opacity:0} }
  @keyframes resC { 0%,58%{opacity:0} 61%,72%{opacity:1} 75%,100%{opacity:0} }
  @keyframes resD { 0%,83%{opacity:0} 86%,97%{opacity:1} 100%{opacity:0} }
  .rs  { animation: resA 36s linear infinite; }
  .rs2 { animation: resB 36s linear infinite; }
  .rs3 { animation: resC 36s linear infinite; }
  .rs4 { animation: resD 36s linear infinite; }

  /* run log — per-line animation-delay phase-shifts each line inside the same 36s period */
  @keyframes logIn { 0%{opacity:0} 1.5%{opacity:1} 92%{opacity:1} 98%,100%{opacity:0} }
  .L { opacity: 0; animation: logIn 36s linear infinite; }
</style>

<rect x="0" y="0" width="1000" height="530" fill="#0F0E0A"></rect>
<rect x="0.5" y="0.5" width="999" height="469" fill="none" stroke="#0F0E0A"></rect>
<line x1="0" y1="34" x2="1000" y2="34" stroke="#2D2A24"></line>
<text class="m" x="18" y="22" font-size="10" letter-spacing="1.4" fill="#F8F5EE">THE DESK</text>
<text class="m" x="90" y="22" font-size="9" letter-spacing="1" fill="#6B645A">CLAUDE-QUANT · UNATTENDED</text>
<g class="m" font-size="10" letter-spacing="1.2" text-anchor="end" fill="#B9A0FF">
  <text class="a1" x="982" y="22">ACT 1 · BTC · TREND · KELLY CAPPED · CLOSED IN PROFIT</text>
  <text class="a2" opacity="0" x="982" y="22">ACT 2 · ETH · FUNDING RICH · CARRY · CLOSED IN PROFIT</text>
  <text class="a3" opacity="0" x="982" y="22" fill="#FF6B4A">ACT 3 · SOL · VOL SPIKE · REFUSED, NO POSITION</text>
  <text class="a4" opacity="0" x="982" y="22">ACT 4 · ARB · THIN BOOK · STOPPED OUT, WITHIN LIMIT</text>
</g>

