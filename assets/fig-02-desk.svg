  <text x="18" y="76">BTC-PERP</text><text x="18" y="98">ETH-PERP</text><text x="18" y="120">SOL-PERP</text><text x="18" y="142">ARB-PERP</text>
</g>
<g>
  <rect x="86" y="68" width="380" height="11" fill="#15130F" stroke="#2D2A24"></rect>
  <rect class="l1" x="110" y="68" width="130" height="11" fill="#B9A0FF"></rect>
  <rect x="86" y="90" width="380" height="11" fill="#15130F" stroke="#2D2A24"></rect>
  <rect class="l2" x="215" y="90" width="107" height="11" fill="#B9A0FF"></rect>
  <rect x="86" y="112" width="380" height="11" fill="#15130F" stroke="#2D2A24"></rect>
  <rect class="rf" opacity="0" x="299" y="112" width="92" height="11" fill="none" stroke="#FF6B4A" stroke-dasharray="3 2"></rect>
  <rect x="86" y="134" width="380" height="11" fill="#15130F" stroke="#2D2A24"></rect>
  <rect class="l4" x="382" y="134" width="76" height="11" fill="#B9A0FF"></rect>
</g>
<g class="m" font-size="9">
  <text class="v1" opacity="0" x="482" y="77" fill="#F8F5EE">long 0.8× · live</text>
  <text class="g1" x="482" y="77" fill="#3FAF6A">closed +1.40 %</text>
  <text class="v2" opacity="0" x="482" y="99" fill="#F8F5EE">short 0.5× · carry</text>
  <text class="g2" x="482" y="99" fill="#3FAF6A">closed +0.62 %</text>
  <text class="rf" opacity="0" x="482" y="121" fill="#FF6B4A">never opened · CON-1</text>
  <text class="v4" opacity="0" x="482" y="143" fill="#F8F5EE">long 0.3× · reduced</text>
  <text class="g4" x="482" y="143" fill="#D9553A">stopped −0.31 %</text>
</g>

<text class="m tiny" x="18" y="168">MARKET</text>
<g class="m" font-size="9.5" fill="#9A9388">
  <text class="a1" x="86" y="168">trend intact, funding neutral, book deep — size is the only question</text>
  <text class="a2" opacity="0" x="86" y="168">funding +0.031 % / 8h, basis rich — the edge is the carry, not the direction</text>
  <text class="a3" opacity="0" x="86" y="168">realised vol 4.2 %, news event live — every size breaches the drawdown limit</text>
  <text class="a4" opacity="0" x="86" y="168">thin book, 40 bps expected slippage — the fill is the risk</text>
</g>
<line x1="18" y1="180" x2="642" y2="180" stroke="#2D2A24"></line>

<g class="m">
  <text class="lbl" x="18" y="200">THE AGENT WRITES THE MATH, THEN RUNS IT</text>
  <text class="lbl" x="642" y="200" text-anchor="end">A DIFFERENT FORMULA PER SITUATION</text>
</g>
<rect x="18" y="208" width="386" height="72" fill="#15130F" stroke="#2D2A24"></rect>
<g class="m code">
  <g class="a1">
    <text x="30" y="224"><tspan fill="#6B645A">def</tspan> size(edge, vol, book):</text>
    <text x="30" y="238">  kelly = edge / vol**2</text>
    <text x="30" y="252">  cap = <tspan fill="#B9A0FF">0.02</tspan> * book  <tspan fill="#6B645A"># CON-1</tspan></text>
    <text x="30" y="266">  <tspan fill="#6B645A">return</tspan> min(kelly, cap)</text>
  </g>
  <g class="a2" opacity="0">
    <text x="30" y="224"><tspan fill="#6B645A">def</tspan> carry(funding_8h, fees, days):</text>
    <text x="30" y="238">  gross = funding_8h * 3 * days</text>
    <text x="30" y="252">  net = gross - fees - <tspan fill="#B9A0FF">borrow</tspan></text>
    <text x="30" y="266">  <tspan fill="#6B645A">return</tspan> net <tspan fill="#6B645A">if</tspan> net &gt; 2*fees <tspan fill="#6B645A">else</tspan> 0</text>
  </g>
  <g class="a3" opacity="0">
    <text x="30" y="224"><tspan fill="#6B645A">def</tspan> projected_dd(vol, size, horizon):</text>
    <text x="30" y="238">  sigma = vol * sqrt(horizon)</text>
    <text x="30" y="252">  <tspan fill="#6B645A">return</tspan> <tspan fill="#FF6B4A">2.33</tspan> * sigma * size  <tspan fill="#6B645A"># 99 %</tspan></text>
    <text x="30" y="266">  <tspan fill="#6B645A"># min size still breaches CON-1</tspan></text>
  </g>
  <g class="a4" opacity="0">
    <text x="30" y="224"><tspan fill="#6B645A">def</tspan> liq_size(depth, target, slip_bps):</text>
    <text x="30" y="238">  fillable = depth * <tspan fill="#B9A0FF">slip_bps</tspan> / 40</text>
    <text x="30" y="252">  <tspan fill="#6B645A">return</tspan> min(target, fillable)</text>
    <text x="30" y="266">  <tspan fill="#6B645A"># 0.8× → 0.3×, stop at 1 sigma</tspan></text>
  </g>
</g>
<rect class="sb" x="418" y="208" width="152" height="20" stroke="#DDD6C8"></rect>
<text class="m sbt" x="428" y="222" font-size="9.5">→ sandbox run_python</text>
<g class="m" font-size="9.5">
  <g class="rs"><text x="418" y="244" fill="#3FAF6A">kelly=0.31 · cap binds</text><text x="418" y="258" fill="#3FAF6A">size → 0.8× base</text><text x="418" y="272" fill="#B9A0FF">proof → DEC-14</text></g>
  <g class="rs rs2" opacity="0"><text x="418" y="244" fill="#3FAF6A">net carry = 0.94 % / wk</text><text x="418" y="258" fill="#3FAF6A">clears 2× fees</text><text x="418" y="272" fill="#B9A0FF">proof → DEC-15</text></g>
  <g class="rs rs3" opacity="0"><text x="418" y="244" fill="#FF6B4A">dd 99 % = 2.8 % of book</text><text x="418" y="258" fill="#FF6B4A">CON-1 allows 2.0 %</text><text x="418" y="272" fill="#FF6B4A">no size passes</text></g>
  <g class="rs rs4" opacity="0"><text x="418" y="244" fill="#3FAF6A">fillable = 0.3× target</text><text x="418" y="258" fill="#9A9388">stop at 1 sigma</text><text x="418" y="272" fill="#B9A0FF">proof → DEC-17</text></g>
</g>

