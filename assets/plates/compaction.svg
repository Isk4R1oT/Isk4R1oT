    <text x="295" y="324" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#f0b429">dropped: the constraint the user gave in turn 6</text>
  </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.52460;0.54127;0.99889;1.00000" values="0;0;1;1;0"/>
