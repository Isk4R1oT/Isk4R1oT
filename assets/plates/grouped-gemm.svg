    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.35972;0.37639;0.99889;1.00000" values="0;0;1;1;0"/>
      <rect x="382" y="323.3" width="136" height="114.7" rx="3" fill="#1f7a52"/>
      <text x="450" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">tiled</text>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.45347;0.47014;0.99889;1.00000" values="0;0;1;1;0"/>
      <rect x="545" y="291.4" width="136" height="146.6" rx="3" fill="#1f7a52"/>
      <text x="613" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">double-buffered</text>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.54722;0.56389;0.99889;1.00000" values="0;0;1;1;0"/>
      <rect x="708" y="268.8" width="136" height="169.2" rx="3" fill="#4ade9a"/>
      <text x="776" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4ade9a" text-anchor="middle">warp-tuned</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.59410;0.61076;0.99889;1.00000" values="0;0;1;1;0"/>
