<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="Iskariot — AI Systems Engineer. Animated schematics of the serving and agent stack.">
  <title>Iskariot — AI Systems Engineer</title>
  <desc>Animated schematic plates: knee. Illustrations of how these mechanisms behave — not benchmark results.</desc>

  <defs>
    <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a23"/>
      <stop offset="1" stop-color="#0f131a"/>
    </linearGradient>
    <linearGradient id="gSignal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f7a52"/><stop offset="1" stop-color="#4ade9a"/>
    </linearGradient>
    <linearGradient id="gCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c4a86"/><stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="gWarn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6417"/><stop offset="1" stop-color="#f0b429"/>
    </linearGradient>
    <radialGradient id="atmos" cx="0.34" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#070910" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-160%" width="220%" height="420%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="539" rx="12" fill="#070910" stroke="#1e242e"/>
  <rect x="1" y="1" width="898" height="538" rx="12" fill="url(#atmos)"/>
  <path d="M13 1.5 H887" stroke="#ffffff" stroke-opacity="0.07"/>

  <g>
    <text x="58" y="40" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="5.4" font-weight="500" fill="#7aa2f7">AI SYSTEMS ENGINEER</text>
    <text x="56" y="88" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="11" font-weight="400" fill="#e8edf4">ISKARIOT</text>
    <text x="58" y="114" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="0.2" font-weight="400" fill="#97a1af">inference · agent runtimes · evals · tracing · the product on top</text>

    <g>
      <rect x="620" y="30" width="224" height="80" rx="7" fill="url(#plateFill)" stroke="#1e242e"/>
      <path d="M627 30.5 H837" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="636" y="56" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766">STACK</text>
      <text x="704" y="56" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">SGLang · vLLM · Rust</text>
      <text x="636" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766">FOCUS</text>
      <text x="704" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">AI infra, end to end</text>
      <text x="636" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766">BASE</text>
      <text x="704" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">GMT+5 · remote</text>
    </g>

    <line x1="56" y1="136" x2="844" y2="136" stroke="#1e242e"/>

    <g opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.05000;0.95000;1.00000" values="0;1;1;0"/>
    <text x="56" y="168" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="2.2" font-weight="500" fill="#e8edf4">THE KNEE</text>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.05000;0.06667;0.99889;1.00000" values="0;0;1;1;0"/><text x="56" y="189" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="0.1" font-weight="400" fill="#97a1af">time-to-first-token barely moves from 32 to 64, then falls apart at 128</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.60972;0.62639;0.99889;1.00000" values="0;0;1;1;0"/><g>
  <text x="844" y="171" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" letter-spacing="0.4" font-weight="700" fill="#f0b429" text-anchor="end">128</text>
  <text x="844" y="188" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="end">the batch that broke it</text>
</g></g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.09444;0.11111;0.99889;1.00000" values="0;0;1;1;0"/>
  <line x1="56" y1="438" x2="844" y2="438" stroke="#1e242e" stroke-width="1"/>
  <line x1="56" y1="240" x2="56" y2="438" stroke="#1e242e" stroke-width="1"/>
  <text x="56" y="232" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766">ttft   ·   x: batch size</text>
</g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.51597;0.53264;0.99889;1.00000" values="0;0;1;1;0"/>
    <line x1="637" y1="400.38" x2="824" y2="392.46" stroke="#4d5766" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="816" y="408.46" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="end">where linear extrapolation put it</text>
  </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.17222;0.18889;0.99889;1.00000" values="0;0;1;1;0"/>
      <line x1="76" y1="422.16" x2="263" y2="416.22" stroke="#4ade9a" stroke-width="2"/>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.28160;0.29826;0.99889;1.00000" values="0;0;1;1;0"/>
      <line x1="263" y1="416.22" x2="450" y2="408.3" stroke="#4ade9a" stroke-width="2"/>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.39097;0.40764;0.99889;1.00000" values="0;0;1;1;0"/>
      <line x1="450" y1="408.3" x2="637" y2="400.38" stroke="#4ade9a" stroke-width="2"/>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.50035;0.51701;0.99889;1.00000" values="0;0;1;1;0"/>
      <line x1="637" y1="400.38" x2="824" y2="251.88000000000002" stroke="#f0b429" stroke-width="2.6"/>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.11667;0.13333;0.99889;1.00000" values="0;0;1;1;0"/>
      <circle cx="76" cy="422.16" r="3.4" fill="#4ade9a"/>
      <text x="76" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">8</text>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.17222;0.18889;0.99889;1.00000" values="0;0;1;1;0"/>
      <circle cx="263" cy="416.22" r="3.4" fill="#4ade9a"/>
      <text x="263" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">16</text>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.28160;0.29826;0.99889;1.00000" values="0;0;1;1;0"/>
      <circle cx="450" cy="408.3" r="3.4" fill="#4ade9a"/>
      <text x="450" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">32</text>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.39097;0.40764;0.99889;1.00000" values="0;0;1;1;0"/>
      <circle cx="637" cy="400.38" r="3.4" fill="#4ade9a"/>
      <text x="637" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">64</text>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.50035;0.51701;0.99889;1.00000" values="0;0;1;1;0"/>
      <circle cx="824" cy="251.88000000000002" r="5" fill="#f0b429"/>
      <text x="824" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">128</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.70556;0.72222;0.99889;1.00000" values="0;0;1;1;0"/><text x="56" y="478" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.1" font-weight="400" fill="#4d5766">the performance space is not a flat sheet — nothing you measured below the knee predicts what is above it</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.73056;0.74722;0.99889;1.00000" values="0;0;1;1;0"/><text x="56" y="498" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="0.1" font-weight="500" fill="#4ade9a">→  I benchmark at the batch sizes I will actually serve, and never interpolate between them</text></g>
    <text x="844" y="526" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#2b3340" text-anchor="end">SCHEMATIC · NOT A BENCHMARK</text>
  </g>

    <line x1="56" y1="506" x2="844" y2="506" stroke="#161b24"/>
    <rect x="56" y="519" width="2" height="7" rx="1" fill="#4d5766" opacity="0.3">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.01944;0.98056;1.00000" values="0.3;1;1;0.3"/>
    </rect>
  </g>
</svg>
