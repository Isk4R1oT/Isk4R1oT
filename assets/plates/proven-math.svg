<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="Iskariot — AI Systems Engineer. Animated schematics of the serving and agent stack.">
  <title>Iskariot — AI Systems Engineer</title>
  <desc>Animated schematic plates: proven-math. Illustrations of how these mechanisms behave — not benchmark results.</desc>

  <defs>
    <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a23"/>
      <stop offset="1" stop-color="#0f131a"/>
    </linearGradient>
    <linearGradient id="gSignal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f7a52"/><stop offset="1" stop-color="#4ade9a"/>
    </linearGradient>
    <linearGradient id="gCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c4a86"/><stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="gWarn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6417"/><stop offset="1" stop-color="#f0b429"/>
    </linearGradient>
    <radialGradient id="atmos" cx="0.34" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#070910" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-160%" width="220%" height="420%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="539" rx="12" fill="#070910" stroke="#1e242e"/>
  <rect x="1" y="1" width="898" height="538" rx="12" fill="url(#atmos)"/>
  <path d="M13 1.5 H887" stroke="#ffffff" stroke-opacity="0.07"/>

  <g>
    <text x="58" y="40" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="5.4" font-weight="500" fill="#7aa2f7">AI SYSTEMS ENGINEER</text>
    <text x="56" y="88" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="11" font-weight="400" fill="#e8edf4">ISKARIOT</text>
    <text x="58" y="114" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="0.2" font-weight="400" fill="#97a1af">inference · agent runtimes · evals · tracing · the product on top</text>

    <g>
      <rect x="620" y="30" width="224" height="80" rx="7" fill="url(#plateFill)" stroke="#1e242e"/>
      <path d="M627 30.5 H837" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="636" y="56" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766">STACK</text>
      <text x="704" y="56" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">SGLang · vLLM · Rust</text>
      <text x="636" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766">FOCUS</text>
      <text x="704" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">AI infra, end to end</text>
      <text x="636" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766">BASE</text>
      <text x="704" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">GMT+5 · remote</text>
    </g>

    <line x1="56" y1="136" x2="844" y2="136" stroke="#1e242e"/>

    <g opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.05000;0.95000;1.00000" values="0;1;1;0"/>
    <text x="56" y="168" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="2.2" font-weight="500" fill="#e8edf4">THE AGENT THAT PROVES ITS OWN MATH</text>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.05000;0.06667;0.99889;1.00000" values="0;0;1;1;0"/><text x="56" y="189" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="0.1" font-weight="400" fill="#97a1af">it is not allowed to trust its own arithmetic — it has to demonstrate it first</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.57222;0.58889;0.99889;1.00000" values="0;0;1;1;0"/><g>
  <text x="844" y="171" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" letter-spacing="0.4" font-weight="700" fill="#4d5766" text-anchor="end">pending</text>
  <text x="844" y="188" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="end">self-validated before acting</text>
</g></g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.17222;0.18889;0.99889;1.00000" values="0;0;1;1;0"/>
      <rect x="56" y="258" width="552" height="32" rx="5" fill="url(#plateFill)" stroke="#7aa2f7"/>
      <text x="72" y="279" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#7aa2f7">01</text>
      <text x="104" y="279" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">pick an authoritative formula</text>
      <line x1="332" y1="290" x2="332" y2="300" stroke="#1e242e" stroke-width="1.2"/>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.26746;0.28413;0.99889;1.00000" values="0;0;1;1;0"/>
      <rect x="56" y="300" width="552" height="32" rx="5" fill="url(#plateFill)" stroke="#7aa2f7"/>
      <text x="72" y="321" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#7aa2f7">02</text>
      <text x="104" y="321" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">tune it against real market data</text>
      <line x1="332" y1="332" x2="332" y2="342" stroke="#1e242e" stroke-width="1.2"/>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.36270;0.37937;0.99889;1.00000" values="0;0;1;1;0"/>
      <rect x="56" y="342" width="552" height="32" rx="5" fill="url(#plateFill)" stroke="#4ade9a"/>
      <text x="72" y="363" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4ade9a">03</text>
      <text x="104" y="363" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">run it in the sandbox, with libraries</text>
      <line x1="332" y1="374" x2="332" y2="384" stroke="#1e242e" stroke-width="1.2"/>
    </g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.45794;0.47460;0.99889;1.00000" values="0;0;1;1;0"/>
      <rect x="56" y="384" width="552" height="32" rx="5" fill="url(#plateFill)" stroke="#4ade9a"/>
      <text x="72" y="405" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4ade9a">04</text>
      <text x="104" y="405" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#97a1af">validate against the reference</text>
      
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.57222;0.58889;0.99889;1.00000" values="0;0;1;1;0"/>
      <rect x="652" y="258" width="192" height="116" rx="6" fill="url(#plateFill)" stroke="#4ade9a"/>
      <text x="748" y="284" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">gate</text>
      <text x="748" y="322" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" letter-spacing="0.4" font-weight="700" fill="#4ade9a" text-anchor="middle">pass</text>
      <text x="748" y="350" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">then it may act</text>
      <g stroke="#4ade9a" fill="#4ade9a">
    <line x1="620" y1="316" x2="642" y2="316" stroke="#4ade9a" stroke-width="1.2"/>
    <path d="M648 316 L641 312.4 L641 319.6 Z" stroke="none"/>
  </g>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.70556;0.72222;0.99889;1.00000" values="0;0;1;1;0"/><text x="56" y="478" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.1" font-weight="400" fill="#4d5766">an agent confident about a number it never checked is more dangerous than one that refuses to answer</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.73056;0.74722;0.99889;1.00000" values="0;0;1;1;0"/><text x="56" y="498" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="0.1" font-weight="500" fill="#4ade9a">→  I gave it a numerical oracle instead of asking it to be careful</text></g>
    <text x="844" y="526" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#8a6417" text-anchor="end">UNVERIFIED · AWAITING NUMBERS</text>
  </g>

    <line x1="56" y1="506" x2="844" y2="506" stroke="#161b24"/>
    <rect x="56" y="519" width="2" height="7" rx="1" fill="#4d5766" opacity="0.3">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.01944;0.98056;1.00000" values="0.3;1;1;0.3"/>
    </rect>
  </g>
</svg>
