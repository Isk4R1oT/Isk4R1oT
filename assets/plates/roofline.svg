    <line x1="372" y1="356" x2="372" y2="438" stroke="#4d5766" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="372" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#4d5766" text-anchor="middle">201</text>
  </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.13889;0.15556;0.99889;1.00000" values="0;0;1;1;0"/>
    <path d="M56 434 L556 278 L844 278" fill="none" stroke="#7aa2f7" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="556" y1="278" x2="556" y2="438" stroke="#7aa2f7" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="556" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#7aa2f7" text-anchor="middle">295</text>
  </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.18222;0.18889;0.25278;0.25833;0.99889;1.00000" values="0;0;1;1;0;0;0"/>
      <text data-slot="batch" x="844" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#4ade9a" text-anchor="end">b 1</text>
    </g><g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.27597;0.28264;0.34653;0.35208;0.99889;1.00000" values="0;0;1;1;0;0;0"/>
      <text data-slot="batch" x="844" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#4ade9a" text-anchor="end">b 8</text>
    </g><g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.36972;0.37639;0.44028;0.44583;0.99889;1.00000" values="0;0;1;1;0;0;0"/>
      <text data-slot="batch" x="844" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#4ade9a" text-anchor="end">b 32</text>
    </g><g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.46347;0.47014;0.53403;0.53958;0.99889;1.00000" values="0;0;1;1;0;0;0"/>
      <text data-slot="batch" x="844" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#4ade9a" text-anchor="end">b 96</text>
    </g><g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.55722;0.56389;0.62778;0.63333;0.99889;1.00000" values="0;0;1;1;0;0;0"/>
      <text data-slot="batch" x="844" y="456" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.2" font-weight="400" fill="#4ade9a" text-anchor="end">b 256</text>
    </g>
    <circle r="5.5" cx="56" cy="434" fill="#4ade9a" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.17778;0.18889;0.99889;1.00000" values="0;0;1;1;0"/>
      <animate attributeName="cx" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.18889;0.46111;0.68889;0.99889;1.00000" values="56;56;556;804;804;56"/>
      <animate attributeName="cy" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.18889;0.46111;0.68889;0.99889;1.00000" values="434;434;278;278;278;434"/>
    </circle>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.62778;0.64444;0.99889;1.00000" values="0;0;1;1;0"/>
      <text x="844" y="266" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#7aa2f7" text-anchor="end">the roof ignores model size</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.70556;0.72222;0.99889;1.00000" values="0;0;1;1;0"/><text x="56" y="478" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.1" font-weight="400" fill="#4d5766">the regime is set by batch size, not by model size — this is where intuition fails first</text></g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.73056;0.74722;0.99889;1.00000" values="0;0;1;1;0"/><text x="56" y="498" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="0.1" font-weight="500" fill="#4ade9a">→  every sizing conversation I open starts at the ridge point, not at the parameter count</text></g>
    <text x="844" y="526" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" letter-spacing="1.4" font-weight="400" fill="#2b3340" text-anchor="end">SCHEMATIC · NOT A BENCHMARK</text>
  </g>

    <line x1="56" y1="506" x2="844" y2="506" stroke="#161b24"/>
    <rect x="56" y="519" width="2" height="7" rx="1" fill="#4d5766" opacity="0.3">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0.00000;0.01944;0.98056;1.00000" values="0.3;1;1;0.3"/>
